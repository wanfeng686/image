<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能客服</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: #fff; display: flex; flex-direction: column; overflow: hidden; }
  .header { padding: 12px 16px; background: #4F46E5; color: #fff; display: flex;
            justify-content: space-between; align-items: center; flex-shrink: 0; }
  .header .info { min-width: 0; }
  .header h1 { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header p { font-size: 11px; opacity: .85; margin-top: 2px; }
  .header .acts { display: flex; gap: 6px; flex-shrink: 0; }
  .header button { border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff;
                   border-radius: 7px; padding: 4px 9px; font-size: 12px; cursor: pointer; }
  .header button:hover { background: rgba(255,255,255,.15); }
  .messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 9px; background: #f8fafc; }
  .bubble { max-width: 82%; padding: 9px 13px; border-radius: 13px; font-size: 13.5px;
            line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .customer { align-self: flex-end; background: #4F46E5; color: #fff; border-bottom-right-radius: 4px; }
  .agent { align-self: flex-start; background: #eef1f6; color: #222; border-bottom-left-radius: 4px; }
  .status { align-self: flex-start; font-size: 12px; color: #888; padding: 2px 6px;
            display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #4F46E5; animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .steps { align-self: flex-start; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; font-size: 10.5px; }
  .steps span { background: #eef1f6; color: #98a; border-radius: 4px; padding: 1px 6px; }
  .steps i { font-style: normal; color: #c3c8d4; }
  .card { align-self: flex-start; width: 86%; border: 1px solid #e3e6ee; border-radius: 12px;
          overflow: hidden; font-size: 12.5px; background: #fff; }
  .card .card-head { padding: 7px 12px; font-size: 11.5px; color: #fff; display: flex; justify-content: space-between; }
  .card.order .card-head { background: #3b82f6; }
  .card.refund .card-head { background: #f59e0b; }
  .card .card-body { padding: 9px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px 12px; }
  .card .card-body b { color: #444; font-weight: 500; }
  .card .full { grid-column: 1 / -1; }
  .banner { align-self: stretch; background: #fffbeb; border: 1px solid #fcd34d; color: #92400e;
            border-radius: 10px; padding: 7px 11px; font-size: 12px; text-align: center; }
  .inputbar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #eceef2; background: #fff; flex-shrink: 0; }
  .inputbar input { flex: 1; border: 1px solid #dfe3ea; border-radius: 9px; padding: 9px 11px; font-size: 13.5px; outline: none; }
  .inputbar input:focus { border-color: #4F46E5; }
  .inputbar button { border: none; background: #4F46E5; color: #fff; border-radius: 9px;
                     padding: 0 16px; font-size: 13.5px; cursor: pointer; }
  .inputbar button:disabled { background: #b9c3f7; cursor: not-allowed; }
  .boot-err { margin: auto; text-align: center; color: #94a3b8; font-size: 13px; padding: 24px; line-height: 1.8; }
</style>
</head>
<body>

<div class="header" id="header">
  <div class="info">
    <h1 id="title">智能客服</h1>
    <p id="subtitle">在线 · 随时为您服务</p>
  </div>
  <div class="acts">
    <button id="escalate" title="铁律：点击即直转人工">🖐️ 转人工</button>
    <button id="minimize" title="最小化">—</button>
  </div>
</div>
<div class="messages" id="messages"><div class="boot-err" id="bootMsg">正在连接客服…</div></div>
<div class="inputbar">
  <input id="input" type="text" placeholder="请输入您的问题…" autocomplete="off" disabled>
  <button id="send" disabled>发送</button>
</div>

<script>
const API = location.origin + "/api/chat";
const params = new URLSearchParams(location.search);
const KEY = params.get("key") || "";
const EMBED = params.get("embed") === "1";
// 商户页面 origin（loader 传入），作为白名单声明回传服务端
const PAGE_ORIGIN = params.get("o") || (document.referrer ? new URL(document.referrer).origin : "");
const HDRS = { "Content-Type": "application/json", "X-Widget-Key": KEY, "X-Widget-Origin": PAGE_ORIGIN };

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
let sessionId = null, busy = false, brand = null;

function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }
function applyBrand(b) {
  brand = b;
  document.getElementById("title").textContent = b.title;
  document.getElementById("header").style.background = b.theme_color;
  document.querySelectorAll(".customer, .dot").forEach(el => el.style.background = b.theme_color);
  document.querySelector(".inputbar button").style.background = b.theme_color;
  document.querySelector(".inputbar button").disabled = false;
  const css = document.createElement("style");
  css.textContent = `.customer{background:${b.theme_color}} .dot{background:${b.theme_color}}`;
  document.head.appendChild(css);
  if (EMBED && window.parent !== window) {
    try { window.parent.postMessage({ type: "ssw:brand", color: b.theme_color }, "*"); } catch (e) {}
  }
}

function addBubble(role, text = "") {
  const el = document.createElement("div");
  el.className = "bubble " + role;
  el.textContent = text;   // 纯文本渲染，防注入
  messagesEl.appendChild(el);
  scrollBottom();
  return el;
}
function addStatus(text) {
  const el = document.createElement("div");
  el.className = "status";
  el.innerHTML = '<span class="dot"></span>';
  el.appendChild(document.createTextNode(text));
  messagesEl.appendChild(el);
  scrollBottom();
  return el;
}
function addSteps(steps) {
  const el = document.createElement("div");
  el.className = "steps";
  el.innerHTML = steps.map(s => "<span>" + s + "</span>").join("<i>→</i>");
  messagesEl.appendChild(el);
  scrollBottom();
}
function addCard(card) {
  const CN = { paid: "已支付", shipped: "已发货", delivered: "已签收",
               refunding: "退款中", refunded: "已退款",
               auto_approved: "✅ 已自动退款", pending_approval: "⏳ 等待人工审批" };
  const type = card.type === "refund" ? "退款进度" : "订单详情";
  const rows = [];
  const row = (k, v, cls) => rows.push('<div class="' + (cls || "") + '"><b>' + k + '</b>：' + v + "</div>");
  if (card.type === "order") {
    row("商品", card.product); row("金额", "¥" + Number(card.amount).toFixed(2));
    row("状态", CN[card.status] || card.status); row("预计送达", card.eta || "—");
    if (card.tracking_no) row("物流", card.carrier + " " + card.tracking_no, "full");
  } else {
    row("订单", card.order_no); row("金额", "¥" + Number(card.amount).toFixed(2));
    row("进度", CN[card.status] || card.status);
    if (card.risk_score != null) row("风险分", card.risk_score + "（" + (card.risk_level || "") + "）");
    if (card.required_approvals > 1) row("审批", "需双签（2 人）", "full");
  }
  const el = document.createElement("div");
  el.className = "card " + card.type;
  el.innerHTML = '<div class="card-head"><span>' + type + '</span><span>' + (card.order_no || "") +
                 "</span></div>" + '<div class="card-body">' + rows.join("") + "</div>";
  messagesEl.appendChild(el);
  scrollBottom();
}
function addBanner(text) {
  const el = document.createElement("div");
  el.className = "banner";
  el.textContent = text;
  messagesEl.appendChild(el);
  scrollBottom();
}

async function init() {
  if (!KEY) { bootFail("缺少接入密钥（data-key）"); return; }
  try {
    const resp = await fetch(location.origin + "/api/widget/sessions", {
      method: "POST", headers: HDRS, body: JSON.stringify({}),
    });
    if (!resp.ok) {
      const b = await resp.json().catch(() => ({}));
      bootFail(resp.status === 401 ? "接入密钥无效，请联系商户检查嵌入代码"
              : resp.status === 403 ? "当前网站未在商户白名单内"
              : "暂时无法连接客服，请稍后再试");
      return;
    }
    const data = await resp.json();
    sessionId = data.session.id;
    applyBrand(data.brand || {});
    document.getElementById("bootMsg")?.remove();
    addBubble("agent", data.brand.welcome || "您好，请问有什么可以帮您？");
    inputEl.disabled = false; sendBtn.disabled = false;
  } catch (e) {
    bootFail("网络异常，请稍后再试");
  }
}
function bootFail(msg) {
  const el = document.getElementById("bootMsg");
  if (el) el.textContent = "😕 " + msg;
}

async function escalate() {
  if (!sessionId) return;
  await fetch(API + "/sessions/" + sessionId + "/escalate", { method: "POST" });
  addBanner("已为您转接人工客服，请稍候…");
  document.getElementById("subtitle").textContent = "已转人工 · 等待客服接入";
}

async function send() {
  const content = inputEl.value.trim();
  if (!content || busy || !sessionId) return;
  busy = true; sendBtn.disabled = true; inputEl.value = "";
  addBubble("customer", content);
  try {
    const resp = await fetch(API + "/sessions/" + sessionId + "/messages/stream", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "", bubble = null, statusEl = null;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) !== -1) {
        const frame = buf.slice(0, i);
        buf = buf.slice(i + 2);
        let event = "message", data = "";
        for (const line of frame.split("\n")) {
          if (line.startsWith("event: ")) event = line.slice(7).trim();
          else if (line.startsWith("data: ")) data += line.slice(6);
        }
        const payload = data ? JSON.parse(data) : {};
        if (event === "turn_start") {
          bubble = addBubble("agent");
        } else if (event === "agent_status") {
          const names = { knowledge: "知识助手检索中…", order: "订单查询中…", resolution: "处置评估中…" };
          if (payload.status === "working") statusEl = addStatus(names[payload.agent] || "处理中…");
          else if (statusEl) { statusEl.remove(); statusEl = null; }
        } else if (event === "message_delta") {
          bubble.textContent += payload.delta;
          scrollBottom();
        } else if (event === "card") {
          addCard(payload.card_data);
        } else if (event === "approval_pending") {
          addBanner("🟡 " + payload.summary + "，结果将第一时间通知您");
        } else if (event === "session_status") {
          document.getElementById("subtitle").textContent = "等待人工审批…";
        } else if (event === "turn_end") {
          addSteps(payload.steps);
        }
      }
    }
  } catch (e) {
    addBubble("agent", "连接出现问题，请稍后重试。");
  }
  busy = false; sendBtn.disabled = false; inputEl.focus();
}

document.getElementById("send").addEventListener("click", send);
document.getElementById("escalate").addEventListener("click", escalate);
inputEl.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
document.getElementById("minimize").addEventListener("click", () => {
  if (EMBED && window.parent !== window) {
    try { window.parent.postMessage({ type: "ssw:close" }, "*"); } catch (e) {}
  }
});
window.addEventListener("message", ev => {
  if (ev.data && ev.data.type === "ssw:focus") inputEl.focus();
});
init();
</script>
</body>
</html>

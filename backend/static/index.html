<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartSupport 智能客服</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #eef1f5; height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .widget {
    width: 440px; height: 660px; max-height: 94vh; background: #fff;
    border-radius: 16px; box-shadow: 0 8px 32px rgba(0, 0, 0, .12);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .header { padding: 14px 20px; background: linear-gradient(135deg, #4f6ef2, #6a5af9); color: #fff;
            display: flex; justify-content: space-between; align-items: center; }
  .header h1 { font-size: 16px; font-weight: 600; }
  .header p { font-size: 11px; opacity: .8; margin-top: 2px; }
  .header button {
    border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff;
    border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  .header button:hover { background: rgba(255,255,255,.15); }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .bubble {
    max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14px;
    line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .customer { align-self: flex-end; background: #4f6ef2; color: #fff; border-bottom-right-radius: 4px; }
  .agent { align-self: flex-start; background: #f2f3f7; color: #222; border-bottom-left-radius: 4px; }
  .status {
    align-self: flex-start; font-size: 12px; color: #888; padding: 2px 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #4f6ef2; animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .steps { align-self: flex-start; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; font-size: 11px; }
  .steps span { background: #f2f3f7; color: #98a; border-radius: 4px; padding: 1px 6px; }
  .steps i { font-style: normal; color: #c3c8d4; }
  /* 数据卡片 */
  .card {
    align-self: flex-start; width: 82%; border: 1px solid #e3e6ee; border-radius: 12px;
    overflow: hidden; font-size: 13px; background: #fff;
  }
  .card .card-head {
    padding: 8px 12px; font-size: 12px; color: #fff; display: flex; justify-content: space-between;
  }
  .card.order .card-head { background: #3b82f6; }
  .card.refund .card-head { background: #f59e0b; }
  .card .card-body { padding: 10px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  .card .card-body b { color: #444; font-weight: 500; }
  .card .full { grid-column: 1 / -1; }
  /* 审批横幅 */
  .banner {
    align-self: stretch; background: #fffbeb; border: 1px solid #fcd34d; color: #92400e;
    border-radius: 10px; padding: 8px 12px; font-size: 12.5px; text-align: center;
  }
  .inputbar { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #eceef2; }
  .inputbar input {
    flex: 1; border: 1px solid #dfe3ea; border-radius: 10px; padding: 10px 12px;
    font-size: 14px; outline: none;
  }
  .inputbar input:focus { border-color: #4f6ef2; }
  .inputbar button {
    border: none; background: #4f6ef2; color: #fff; border-radius: 10px;
    padding: 0 18px; font-size: 14px; cursor: pointer;
  }
  .inputbar button:disabled { background: #b9c3f7; cursor: not-allowed; }
</style>
</head>
<body>
<div class="widget">
  <div class="header">
    <div>
      <h1>SmartSupport 智能客服</h1>
      <p id="subtitle">知识库问答 · 订单查询 · 退款审批 · <a href="/console.html" style="color:#fff">🎛️ 运营台</a></p>
    </div>
    <button id="escalate" title="铁律：点击即直转人工">🖐️ 转人工</button>
  </div>
  <div class="messages" id="messages"></div>
  <div class="inputbar">
    <input id="input" type="text" placeholder="试试：查订单 SO-0002 / 退款 / 退货政策" autocomplete="off">
    <button id="send">发送</button>
  </div>
</div>

<script>
const API = location.origin + "/api/chat";
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
let sessionId = null;
let busy = false;

function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

function addBubble(role, text = "") {
  const el = document.createElement("div");
  el.className = "bubble " + role;
  el.textContent = text;   // textContent：内容永远按纯文本渲染，天然防注入
  messagesEl.appendChild(el);
  scrollBottom();
  return el;
}

function addStatus(text) {
  const el = document.createElement("div");
  el.className = "status";
  el.innerHTML = '<span class="dot"></span>' + text;
  messagesEl.appendChild(el);
  scrollBottom();
  return el;
}

function addSteps(steps) {
  const el = document.createElement("div");
  el.className = "steps";
  el.innerHTML = steps.map(s => "<span>" + s + "</span>").join("<i>→</i>");
  messagesEl.appendChild(el);
  scrollBottom();
}

// 数据卡片：订单卡 / 退款卡（字段全部来自后端 card_data，前端只做展示）
function addCard(card) {
  const CN = { paid: "已支付", shipped: "已发货", delivered: "已签收",
               refunding: "退款中", refunded: "已退款",
               auto_approved: "✅ 已自动退款", pending_approval: "⏳ 等待人工审批" };
  const type = card.type === "refund" ? "退款进度" : "订单详情";
  const rows = [];
  const row = (k, v, cls) => rows.push('<div class="' + (cls || "") + '"><b>' + k + '</b>：' + v + "</div>");
  if (card.type === "order") {
    row("商品", card.product);
    row("金额", "¥" + Number(card.amount).toFixed(2));
    row("状态", CN[card.status] || card.status);
    row("预计送达", card.eta || "—");
    if (card.tracking_no) row("物流", card.carrier + " " + card.tracking_no, "full");
  } else {
    row("订单", card.order_no);
    row("金额", "¥" + Number(card.amount).toFixed(2));
    row("进度", CN[card.status] || card.status);
    if (card.risk_score != null) row("风险分", card.risk_score + "（" + (card.risk_level || "") + "）");
    if (card.required_approvals > 1) row("审批", "需双签（2 人）", "full");
  }
  const el = document.createElement("div");
  el.className = "card " + card.type;
  el.innerHTML = '<div class="card-head"><span>' + type + '</span><span>' + (card.order_no || "") +
                 "</span></div>" + '<div class="card-body">' + rows.join("") + "</div>";
  messagesEl.appendChild(el);
  scrollBottom();
}

function addBanner(text) {
  const el = document.createElement("div");
  el.className = "banner";
  el.textContent = text;
  messagesEl.appendChild(el);
  scrollBottom();
}

// 页面加载即开一个新会话。演示模式：绑定种子数据里的"顾客演示"（有订单可查可退）
// SaaS 化：会话创建必须带租户 Widget 密钥（演示商城）
const WIDGET_KEY = "pk_demo000000000000";

async function init() {
  const resp = await fetch(API + "/sessions", {
    method: "POST", headers: { "Content-Type": "application/json", "X-Widget-Key": WIDGET_KEY },
    body: JSON.stringify({ user_external_id: "demo" }),
  });
  const session = await resp.json();
  sessionId = session.id;
  addBubble("agent", "您好，我是 SmartSupport 智能客服。可以问我政策、查订单、办退款。\n演示提示：您的订单有 SO-0001 / SO-0002 / SO-0003。");
}

async function escalate() {
  if (!sessionId) return;
  await fetch(API + "/sessions/" + sessionId + "/escalate", { method: "POST" });
  addBanner("已为您转接人工客服，请稍候…");
  document.getElementById("subtitle").textContent = "已转人工 · 等待客服接入";
}

async function send() {
  const content = inputEl.value.trim();
  if (!content || busy || !sessionId) return;
  busy = true; sendBtn.disabled = true; inputEl.value = "";
  addBubble("customer", content);

  try {
    const resp = await fetch(API + "/sessions/" + sessionId + "/messages/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "", bubble = null, statusEl = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) !== -1) {
        const frame = buf.slice(0, i);
        buf = buf.slice(i + 2);
        let event = "message", data = "";
        for (const line of frame.split("\n")) {
          if (line.startsWith("event: ")) event = line.slice(7).trim();
          else if (line.startsWith("data: ")) data += line.slice(6);
        }
        const payload = data ? JSON.parse(data) : {};

        if (event === "turn_start") {
          bubble = addBubble("agent");
        } else if (event === "agent_status") {
          const names = { knowledge: "知识助手检索中…", order: "订单查询中…", resolution: "处置评估中…" };
          if (payload.status === "working") statusEl = addStatus(names[payload.agent] || "处理中…");
          else if (statusEl) { statusEl.remove(); statusEl = null; }
        } else if (event === "message_delta") {
          bubble.textContent += payload.delta;
          scrollBottom();
        } else if (event === "card") {
          addCard(payload.card_data);
        } else if (event === "approval_pending") {
          addBanner("🟡 " + payload.summary + "，预计 " +
                    new Date(payload.timeout_at).toLocaleTimeString() + " 前处理");
        } else if (event === "session_status") {
          document.getElementById("subtitle").textContent = "等待人工审批…";
        } else if (event === "turn_end") {
          addSteps(payload.steps);
        }
      }
    }
  } catch (e) {
    addBubble("agent", "连接出现问题，请稍后重试。");
  }
  busy = false; sendBtn.disabled = false; inputEl.focus();
}

sendBtn.addEventListener("click", send);
document.getElementById("escalate").addEventListener("click", escalate);
inputEl.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
init();
inputEl.focus();
</script>
</body>
</html>

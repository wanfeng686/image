<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多多客服工作台（模拟） · 拼多多商家后台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #222; font-size: 14px; }
  a { text-decoration: none; }

  /* 登录页 */
  #loginView { min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: linear-gradient(135deg, #e22e1f, #ff6a3c); }
  .login-card { background: #fff; border-radius: 14px; padding: 34px; width: 360px; box-shadow: 0 12px 40px rgba(0,0,0,.18); }
  .login-card .logo { text-align: center; font-size: 20px; font-weight: 800; color: #e22e1f; margin-bottom: 4px; }
  .login-card .sub { text-align: center; color: #999; font-size: 12.5px; margin-bottom: 22px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: #666; margin-bottom: 5px; }
  .field input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  #loginBtn { width: 100%; padding: 11px; border: none; border-radius: 8px; background: #e22e1f; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  .login-hint { margin-top: 14px; text-align: center; color: #aaa; font-size: 12px; }

  /* 工作台 */
  #workView { display: none; height: 100vh; flex-direction: column; }
  .topbar { background: #fff; border-bottom: 1px solid #e8e8e8; padding: 10px 20px; display: flex; align-items: center; gap: 14px; }
  .topbar .brand { font-weight: 800; color: #e22e1f; }
  .topbar .shop { color: #666; font-size: 13px; }
  .topbar .spacer { flex: 1; }
  .robot { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #666;
           background: #fff7e6; border: 1px solid #ffe2a8; padding: 5px 12px; border-radius: 999px; }
  .layout { flex: 1; display: flex; overflow: hidden; }

  .conv-list { width: 260px; background: #fff; border-right: 1px solid #e8e8e8; overflow-y: auto; }
  .conv-item { padding: 12px 14px; border-bottom: 1px solid #f2f2f2; cursor: pointer; position: relative; }
  .conv-item:hover { background: #fafafa; }
  .conv-item.on { background: #fdeeea; }
  .conv-name { font-weight: 600; font-size: 13.5px; display: flex; justify-content: space-between; }
  .conv-preview { color: #999; font-size: 12.5px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .conv-unread { background: #e22e1f; color: #fff; border-radius: 999px; font-size: 11px; min-width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; }

  .chat { flex: 1; display: flex; flex-direction: column; background: #f5f6f8; }
  .chat-head { background: #fff; border-bottom: 1px solid #e8e8e8; padding: 12px 20px; font-weight: 700; }
  .chat-head span { color: #999; font-weight: 400; font-size: 12.5px; margin-left: 8px; }
  .chat-msgs { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 68%; display: flex; flex-direction: column; }
  .msg .who { font-size: 11px; color: #aaa; margin-bottom: 3px; }
  .msg .msg-text { padding: 10px 13px; border-radius: 10px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; font-size: 13.5px; }
  .msg[data-sender="buyer"] { align-self: flex-start; }
  .msg[data-sender="buyer"] .msg-text { background: #fff; border: 1px solid #ececec; border-top-left-radius: 2px; }
  .msg[data-sender="merchant"] { align-self: flex-end; }
  .msg[data-sender="merchant"] .msg-text { background: #e22e1f; color: #fff; border-top-right-radius: 2px; }
  .msg[data-sender="system"] { align-self: center; }
  .msg[data-sender="system"] .msg-text { background: #eef0f3; color: #888; font-size: 12px; }

  .inputbar { background: #fff; border-top: 1px solid #e8e8e8; padding: 12px 18px; display: flex; gap: 10px; }
  .inputbar textarea { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13.5px; resize: none; height: 46px; font-family: inherit; }
  .inputbar button { padding: 0 22px; border: none; border-radius: 8px; background: #e22e1f; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>

<!-- 登录视图 -->
<div id="loginView">
  <div class="login-card">
    <div class="logo">拼多多商家后台</div>
    <div class="sub">多多客服工作台 · 本地模拟环境</div>
    <div class="field"><label>账号（手机号）</label><input id="username" placeholder="任意账号"></div>
    <div class="field"><label>密码</label><input id="password" type="password" placeholder="任意密码"></div>
    <button id="loginBtn">登 录</button>
    <div class="login-hint">模拟环境：任意账号密码均可登录，仅用于本地演示 RPA 接入</div>
  </div>
</div>

<!-- 工作台视图 -->
<div id="workView">
  <div class="topbar">
    <span class="brand">多多客服</span>
    <span class="shop" id="shopName">模拟拼多多店铺</span>
    <span class="spacer"></span>
    <span class="robot"><input type="checkbox" id="robotToggle" checked style="width:auto"> 🤖 机器人买家：<b id="robotState">开启</b></span>
  </div>
  <div class="layout">
    <div class="conv-list" id="convList"></div>
    <div class="chat">
      <div class="chat-head" id="chatHead">选择左侧会话</div>
      <div class="chat-msgs" id="chatMsgs"></div>
      <div class="inputbar">
        <textarea id="replyInput" placeholder="输入回复…（RPA 托管时由 AI 自动填写）"></textarea>
        <button id="sendBtn">发 送</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ═══════════ 模拟拼多多商家客服工作台 ═══════════
   - 登录：任意账密（模拟环境）
   - 会话/消息仅存内存；DOM 带 data-* 属性供 RPA 适配器读取
   - 机器人买家：登录后自动开启，向固定会话发一条咨询，收到回复后再追问一条
   - window.__sim 提供注入/查询钩子（测试与手动演示用） */

let seq = 1;
const uid = p => p + "-" + (seq++);

const state = {
  conversations: [
    { id: "conv-9001", buyerId: "buyer-901", buyerName: "小普",
      msgs: [{ id: uid("m"), sender: "system", text: "会话开始，等待买家发言…" }],
      unread: 0 },
  ],
  activeConv: null,
  robotOn: true,
  robotStage: 0,
};

const $ = id => document.getElementById(id);

function renderConvs() {
  const box = $("convList");
  box.innerHTML = "";
  state.conversations.forEach(c => {
    const div = document.createElement("div");
    div.className = "conv-item" + (state.activeConv === c.id ? " on" : "");
    div.dataset.convId = c.id;
    div.dataset.buyerId = c.buyerId;
    const last = [...c.msgs].reverse().find(m => m.sender !== "system");
    div.innerHTML = `<div class="conv-name"><span></span>${c.unread ? `<span class="conv-unread">${c.unread}</span>` : ""}</div>
                     <div class="conv-preview"></div>`;
    div.querySelector(".conv-name span").textContent = c.buyerName || c.buyerId;
    div.querySelector(".conv-preview").textContent = last ? last.text.slice(0, 40) : "";
    div.onclick = () => openConv(c.id);
    box.appendChild(div);
  });
}

function openConv(id) {
  const c = state.conversations.find(x => x.id === id);
  if (!c) return;
  state.activeConv = id;
  c.unread = 0;
  $("chatHead").innerHTML = "";
  $("chatHead").append(`${c.buyerName || c.buyerId}`);
  $("chatHead").insertAdjacentHTML("beforeend", `<span>买家ID ${c.buyerId} · 会话 ${c.id}</span>`);
  renderMsgs();
  renderConvs();
}

function renderMsgs() {
  const c = state.conversations.find(x => x.id === state.activeConv);
  const box = $("chatMsgs");
  box.innerHTML = "";
  if (!c) return;
  c.msgs.forEach(m => {
    const div = document.createElement("div");
    div.className = "msg";
    div.dataset.id = m.id;
    div.dataset.sender = m.sender;
    const who = m.sender === "buyer" ? (c.buyerName || c.buyerId)
              : m.sender === "merchant" ? "商家客服" : "系统";
    div.innerHTML = `<div class="who"></div><div class="msg-text"></div>`;
    div.querySelector(".who").textContent = who;
    div.querySelector(".msg-text").textContent = m.text;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

function pushMsg(convId, sender, text) {
  const c = state.conversations.find(x => x.id === convId);
  if (!c) return null;
  const m = { id: uid("m"), sender, text };
  c.msgs.push(m);
  if (sender === "buyer" && state.activeConv !== convId) c.unread += 1;
  if (state.activeConv === convId) renderMsgs();
  renderConvs();
  return m;
}

/* 商家发送（人工点击 或 RPA 填写） */
function merchantSend() {
  const text = $("replyInput").value.trim();
  if (!text || !state.activeConv) return;
  $("replyInput").value = "";
  pushMsg(state.activeConv, "merchant", text);
  robotOnReply();
}
$("sendBtn").onclick = merchantSend;
$("replyInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); merchantSend(); }
});

/* ─── 机器人买家 ─── */
const ROBOT_SCRIPT = [
  "你好，在吗？帮我查一下订单 S-7701 到哪了",      // stage 0 → 需要订单数据
  "好的谢谢，那我退货的话怎么办？",                  // stage 1（收到回复后）
];

function robotAsk() {
  if (!state.robotOn || state.robotStage >= ROBOT_SCRIPT.length) return;
  const q = ROBOT_SCRIPT[state.robotStage];
  pushMsg("conv-9001", "buyer", q);
  state.robotStage += 1;
}
function robotOnReply() {   // 商家回复后，2.5s 追问下一条
  if (!state.robotOn) return;
  setTimeout(() => {
    if (state.robotStage < ROBOT_SCRIPT.length) robotAsk();
    else pushMsg("conv-9001", "buyer", "😊 好的，麻烦了");
  }, 2500);
}

$("robotToggle").onchange = e => {
  state.robotOn = e.target.checked;
  $("robotState").textContent = state.robotOn ? "开启" : "关闭";
};

/* ─── 登录 ─── */
$("loginBtn").onclick = () => {
  const u = $("username").value.trim() || "13800000000";
  $("shopName").textContent = "模拟拼多多店铺（" + u.slice(0, 3) + "****" + u.slice(-2) + "）";
  $("loginView").style.display = "none";
  $("workView").style.display = "flex";
  openConv("conv-9001");
  setTimeout(robotAsk, 1800);   // 登录后 1.8s 买家发第一条
};
$("password").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });

/* ─── 测试/演示钩子 ─── */
window.__sim = {
  inject(convId, text) { return pushMsg(convId || "conv-9001", "buyer", text); },
  state() { return JSON.parse(JSON.stringify(state)); },
};
</script>
</body>
</html>
